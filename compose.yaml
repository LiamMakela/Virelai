x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none



services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: virelai-api
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
    environment:
      <<: *otel-env

      OTEL_SERVICE_NAME: virelai-api

      DATABASE_URL: postgresql+psycopg://virelai:virelai@postgres:5432/virelai
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000

      S3_ACCESS_KEY: virelai
      S3_SECRET_KEY: virelai-dev-password
      S3_REGION: us-east-1

      S3_BUCKET_ORIGINALS: virelai-originals
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: virelai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: virelai
      POSTGRES_PASSWORD: virelai
      POSTGRES_DB: virelai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U virelai -d virelai"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: virelai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: virelai-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Internal Docker traffic uses kafka:19092.
      # Programs running directly on Windows use localhost:9092.
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Required for a one-broker local cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw



    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: virelai-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: virelai
      MINIO_ROOT_PASSWORD: virelai-dev-password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: virelai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 virelai virelai-dev-password &&
      mc mb --ignore-existing local/virelai-originals &&
      mc mb --ignore-existing local/virelai-media &&
      mc anonymous set download local/virelai-media &&
      exit 0;
      "


  transcoder:
    build:
      context: ./services/transcoder
      dockerfile: Dockerfile

    container_name: virelai-transcoder

    environment:
      <<: *otel-env

      OTEL_SERVICE_NAME: virelai-transcoder

      DATABASE_URL: postgresql://virelai:virelai@postgres:5432/virelai

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC_VIDEO_UPLOADED: video.uploaded.v1

      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: virelai
      S3_SECRET_KEY: virelai-dev-password
      S3_REGION: us-east-1

      S3_BUCKET_ORIGINALS: virelai-originals
      S3_BUCKET_MEDIA: virelai-media

    volumes:
      - ./services/transcoder/app:/app/app

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_healthy

      minio:
        condition: service_healthy

    restart: unless-stopped

  ingest:
    build:
      context: ./services/ingest
      dockerfile: Dockerfile

    container_name: virelai-ingest

    ports:
      - "8001:8001"

    environment:

      <<: *otel-env

      OTEL_SERVICE_NAME: virelai-ingest

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC_PLAYBACK_EVENTS: playback.events.v1

    volumes:
      - ./services/ingest/app:/app/app

    depends_on:
      kafka:
        condition: service_healthy

    restart: unless-stopped

  analytics-worker:
    build:
      context: ./services/analytics-worker
      dockerfile: Dockerfile
    

    environment:
      <<: *otel-env

      OTEL_SERVICE_NAME: virelai-analytics-worker

      DATABASE_URL: postgresql://virelai:virelai@postgres:5432/virelai

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

      KAFKA_TOPIC_PLAYBACK_EVENTS: playback.events.v1

    volumes:
      - ./services/analytics-worker/app:/app/app

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_healthy

    restart: unless-stopped

  realtime-worker:
    build:
      context: ./services/realtime-worker
      dockerfile: Dockerfile

    container_name: virelai-realtime-worker

    environment:
      <<: *otel-env

      OTEL_SERVICE_NAME: virelai-realtime-worker

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC_PLAYBACK_EVENTS: playback.events.v1
      REDIS_URL: redis://redis:6379/0

    volumes:
      - ./services/realtime-worker/app:/app/app

    depends_on:
      kafka:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0

    container_name: virelai-prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    ports:
      - "9090:9090"

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      - api
      - ingest
      - transcoder

    restart: unless-stopped


  grafana:
    image: grafana/grafana:13.2.1

    container_name: virelai-grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: virelai-dev-password

    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus

    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.0

    container_name: virelai-tempo

    command:
      - "-target=all"
      - "-config.file=/etc/tempo.yaml"

    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

    ports:
      - "3200:3200"

    restart: unless-stopped


  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0

    container_name: virelai-otel-collector

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro

    ports:
      - "4317:4317"
      - "4318:4318"

    depends_on:
      - tempo

    restart: unless-stopped

  k6:
    image: grafana/k6:1.8.1

    profiles:
      - tools

    environment:
      API_BASE_URL: http://api:8000
      INGEST_BASE_URL: http://ingest:8001

    volumes:
      - ./benchmarks/k6:/scripts:ro
      - ./benchmarks/results:/results

    depends_on:
      - api
      - ingest

  ingest-bench:
    build:
      context: ./services/ingest
      dockerfile: Dockerfile

    environment:
      <<: *otel-env

      OTEL_SERVICE_NAME: virelai-ingest-bench

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC_PLAYBACK_EVENTS: playback.events.v1

    command:
      - opentelemetry-instrument
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --workers
      - "4"

    depends_on:
      kafka:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  tempo_data: